<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: the page runs under the notch and the home-indicator
     strip, and env(safe-area-inset-*) becomes a real number. Without it those
     insets are 0, so the beta shell's bottom bar sat flush on the screen's
     rounded corners and its outer two tabs were half a thumb from unreachable
     on an iPhone web app (Max, 2026-09-02). Every fixed/sticky edge pads by
     the inset: the beta masthead and bar, the body. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Dog Dynasty — WAR Board</title>
<!-- Inline SVG mark in public/ (Vite copies it into dist and rewrites the href
     for base "./"). Without this every load 404s on /favicon.ico. -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Home-screen icons. iOS ignores SVG favicons and screenshots the page
     unless a PNG apple-touch-icon exists; Android reads the manifest. The
     PNGs are opaque on the board field because iOS floods transparency with
     black. Regenerate with scripts/make_icons.py if the mark changes. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="WAR Board">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0c0f13">
<!-- THE LAB'S THEME, BEFORE FIRST PAINT (src/beta/lab/C4_SPEC.md §2.1). On a
     redesign-lab address (#/<league>/lab/...) the saved theme goes on <html>
     before any stylesheet applies, so a light theme never flashes dark. Any
     other address is the live board, which gets an attribute only when its
     own opt-in theme is saved (Original sets none). Keep the --deep values in
     step with src/beta/lab/theme.ts and the token blocks in src/style.css. -->
<script>
(function () {
  try {
    var seg = (location.hash.replace(/^#/, "").split("?")[0].split("/")[2] || "");
    var meta = document.querySelector('meta[name="theme-color"]');
    if (seg !== "lab") {
      /* THE LIVE BOARD'S THEME (src/beta/liveTheme.ts): opt-in, saved under
         its own key. Original sets no attribute. Keep these --bg values in
         step with liveTheme.ts and the live-* blocks in style.css. */
      var bg = { "live-midnight": "#09111e", "live-ember": "#0e0b09", "live-royal": "#0c0b21",
                 "live-pressbox": "#f7f5f0", "live-chalk": "#f5f7fa", "live-clay": "#f8f1e8" };
      var lt = localStorage.getItem("warboard.v3.livetheme");
      if (!bg[lt]) return;
      document.documentElement.setAttribute("data-theme", lt);
      meta.setAttribute("content", bg[lt]);
      return;
    }
    var deep = { original: "#05070a", newsprint: "#161616", ringside: "#04070f", vintage: "#1c2a44" };
    var t = localStorage.getItem("warboard.v3.theme");
    if (!deep[t]) t = "original";
    document.documentElement.setAttribute("data-theme", t);
    meta.setAttribute("content", deep[t]);
  } catch (e) { /* private mode: Original */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- The BETA shell's three faces: Barlow Condensed (labels), Public Sans
     (names, prose) and IBM Plex Mono, which every figure on a beta board is
     set in. One request for the three, alongside the classic board's own link
     rather than replacing it — the two shells ship in one document and the
     classic board keeps Saira Condensed and Archivo. The families are only
     ever referenced from src/beta/beta.css, which is scoped to `.v3`. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- GoatCounter analytics — privacy-friendly, no cookies, no consent banner.
     no_onload because this is a hash-routed SPA: the automatic pageview would
     record every visit as "/" and nothing else. src/lib/analytics.ts counts a
     view per route change instead (GoatCounter ignores localhost on its own,
     so dev traffic never lands in the dashboard). -->
<script data-goatcounter="https://bigdog.goatcounter.com/count"
        data-goatcounter-settings='{"no_onload": true}'
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
