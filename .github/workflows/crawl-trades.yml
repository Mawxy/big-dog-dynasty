name: Crawl - trades (4-way sharded corpus)
# Reads data/crawl_leagues.json (published by the signals crawl) and pulls
# transactions for its shard of the leagues. Four shards run on four runners =
# four separate IPs = 4x the rate budget. Each shard owns its own cache + output
# (trade_corpus_<shard>.json, uploaded as an artifact — too large to commit).
#
# A follow-up `movers` job then merges the shards and rebuilds
# data/dynasty_movers.json — the cross-league over/underpay board on the league
# page, and the ONLY file in this workflow the site reads. It runs on the same
# 4x-daily cadence because the corpus does: refreshing it more often would not
# crawl more leagues (breadth is set by the crawls and Sleeper's per-IP rate
# cap), it would just recompute the same corpus.
on:
  schedule:
    # Every 2h on ODD hours: runs finish in ~30 min, so the extra runs work
    # through the 80k-league backlog faster (each league still re-pulls only
    # after --cooldown-days). Odd hours keep the original property that a run
    # lands an hour after each 6-hourly signals crawl (0,6,12,18), so the
    # league list is fresh. Concurrency below queues, never overlaps, if a
    # rate-limited run overshoots the gap.
    - cron: "0 1-23/2 * * *"
  workflow_dispatch:
permissions:
  contents: read                  # only reads the committed league list
jobs:
  trades:
    runs-on: ubuntu-latest
    # 350 vs --max-minutes 300: same margin as crawl-outcomes (see its comment)
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    concurrency:
      group: crawl-trades-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore/persist shard state
        uses: actions/cache@v4
        with:
          path: .crawl-state/trades-${{ matrix.shard }}
          key: crawl-trades-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: crawl-trades-${{ matrix.shard }}-
      - name: Crawl trades (shard ${{ matrix.shard }} of 4)
        run: |
          python scripts/sleeper_crawl.py --mode trades \
            --state .crawl-state/trades-${{ matrix.shard }} \
            --shard ${{ matrix.shard }} --nshards 4 --max-minutes 300
      - name: Upload corpus shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-corpus-shard-${{ matrix.shard }}
          path: data/trade_corpus_${{ matrix.shard }}.json
          retention-days: 90
          if-no-files-found: ignore

  movers:
    # Aggregation, not crawling. Merges the four shard artifacts (union with
    # the committed corpus, deduped by transaction_id) and rebuilds
    # data/dynasty_movers.json. `always()` is deliberate: a merge over three
    # live shards still beats a stale board, and merge_trade_corpus.py falls
    # back to the committed corpus when every artifact is missing. Only the
    # small movers JSON is committed — the merged corpus itself (~5 MB) would
    # bloat history at 4 commits a day for a file nothing in src/ reads.
    needs: trades
    if: always()
    runs-on: ubuntu-latest
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    # 45, not 15: the TE-premium lookups fetch each unseen league once. The
    # committed data/tep_map.json cache keeps steady-state runs to a few dozen
    # fetches, but a cold cache against a 10k-trade window needs the headroom —
    # the 15-minute cap is what silently froze the board on 2026-08-20.
    timeout-minutes: 45
    permissions:
      contents: write               # commits data/dynasty_movers.json
    concurrency:
      group: crawl-trades-movers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download corpus shards
        uses: actions/download-artifact@v4
        with:
          pattern: trade-corpus-shard-*
          path: data
          merge-multiple: true
      - name: Merge shards into one corpus
        run: python scripts/merge_trade_corpus.py
      - name: Day stamp for the player-map cache key
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore/persist the Sleeper player map
        id: pmap
        uses: actions/cache@v4
        with:
          # Same shape as the crawl lanes' shared-player-map entry (see
          # crawl-signals.yml), keyed on the UTC DATE instead of the run id.
          # This job runs after EVERY shard pass — 12x a day on the odd-hour
          # cron — and a run-id key would re-download the map every one of
          # those times. With a date key the first run of a day misses the
          # exact key, restores yesterday's copy through the prefix, fetches
          # over it and saves under today's; every later run that day is an
          # exact hit and makes no call at all.
          path: sleeper_data/players.json
          key: movers-players-nfl-${{ steps.day.outputs.d }}
          restore-keys: movers-players-nfl-
      - name: Fetch the Sleeper player map
        # names/positions for the board; ~19 MB, the call PROJECT_NOTES caveat
        # #3 says to make at most once a day — which is what the date-keyed
        # cache above buys, this step running only when today's key missed.
        # Downloaded to a temp path and validated first: curl truncates its -o
        # target before the transfer, so a failed fetch would otherwise clobber
        # the restored copy with an empty file AND cache that for the day.
        # Soft-fail either way — dynasty_movers.py degrades to "#pid" labels
        # with no map at all, and a day-old map is fine here (the daily
        # pipeline runs off a WEEKLY one).
        if: steps.pmap.outputs.cache-hit != 'true'
        run: |
          mkdir -p sleeper_data
          if curl -sf --retry 3 https://api.sleeper.app/v1/players/nfl \
               -o sleeper_data/players.json.tmp \
             && python -m json.tool sleeper_data/players.json.tmp > /dev/null 2>&1; then
            mv sleeper_data/players.json.tmp sleeper_data/players.json
          else
            rm -f sleeper_data/players.json.tmp
            echo "::warning::player map fetch failed — falling back to the restored copy if there is one"
          fi
      - name: Build dynasty movers
        run: python scripts/dynasty_movers.py
      - name: Commit dynasty_movers.json + TE-premium cache
        id: commit
        run: |
          git config user.name "big-dog-bot"
          git config user.email "actions@users.noreply.github.com"
          git rebase --abort 2>/dev/null || true
          # RE-PARENT, never rebase — same rationale as crawl-signals: these
          # are generated files rewritten whole, their local history is worth
          # nothing, and this job is the ONLY writer of them.
          for i in 1 2 3 4 5; do
            git fetch origin main || { sleep $((i*10)); continue; }
            git reset FETCH_HEAD
            if ! python -m json.tool data/dynasty_movers.json > /dev/null 2>&1; then
              echo "::warning title=Invalid JSON::data/dynasty_movers.json did not parse — not committing"
              exit 0
            fi
            git add data/dynasty_movers.json
            # the cache is optional (absent until the first live lookup) but
            # committing it is what keeps later runs fast — stage it whenever
            # it exists and parses
            if python -m json.tool data/tep_map.json > /dev/null 2>&1; then
              git add data/tep_map.json
            fi
            git diff --cached --quiet && { echo "no changes"; exit 0; }
            git commit -m "Dynasty movers $(date -u +%FT%H:%MZ)"
            if git push origin HEAD:main; then
              echo "committed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $i failed; retrying in $((i*10))s"; sleep $((i*10))
          done
          echo "push failed after 5 attempts"; exit 1

  deploy:
    # A push made with the default GITHUB_TOKEN never triggers `on: push`
    # workflows — GitHub's recursion guard, and the reason data-refresh chains
    # its deploy through workflow_call. Without this chain the movers job's
    # boards sat committed on main while Pages served the stale one until the
    # next human push (which is exactly what happened on 2026-08-21). Gated on
    # `committed` so the ~12 daily runs only deploy when the board actually
    # changed.
    needs: movers
    if: needs.movers.outputs.committed == '1'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
