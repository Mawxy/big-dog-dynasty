name: PFF ingest
# Fires when ingest_pff.bat pushes new role labels (Max, 2026-09-30). The raw
# exports are pulled by hand from PFF Premium Stats in Max's own browser and
# stay on his PC: data/pff/<season>/ is gitignored, because PFF's terms bar
# redistributing them and this repo is public. scripts/ingest_pff.py commits only
# data/pff/roles_<season>.json, the categorical labels derived from them, so that
# is all this path filter can ever see. Nothing in CI touches PFF.
#
# This job re-validates what landed: the labels are well formed, and no raw
# export has reached the checkout. The exports themselves (header, row count, 32
# teams, rates in range) are validated at ingest time on Max's PC, not here. The
# defense-vs-role build hangs off this same trigger once it exists.
#
# Read-only: it commits nothing, so it stays out of the data-push group.
on:
  push:
    branches: [main]
    paths:
      - "data/pff/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # stdlib only; no install step needed
      - name: Validate committed PFF exports
        run: python scripts/ingest_pff.py --check
