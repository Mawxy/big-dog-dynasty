name: Tests
# Engine invariants (WAA/WAR pool, win-shift, played rule), front-end types,
# and the trade-model invariants that both shells' trade screens share.
# Fast, no network, no Sleeper calls — safe to run on every push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read          # reads the checkout, commits nothing
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: WAR engine invariants
        # EXPECTED_SKIPS pins the skip count. The suite reports "OK (skipped=8)"
        # and stays green when a test stops running, so a skip that appears on
        # its own is invisible — and a skipped methodology invariant is exactly
        # the kind of thing that goes unnoticed for months. Counted from the
        # result object rather than parsed out of the log, so the check can't
        # drift with the output format. Change the number when the change is
        # deliberate; that edit is the record of it.
        env:
          EXPECTED_SKIPS: "8"
        run: |
          python - <<'PY'
          import os, sys, unittest
          res = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.discover("tests"))
          if not res.wasSuccessful():
              sys.exit(1)
          want, got = int(os.environ["EXPECTED_SKIPS"]), len(res.skipped)
          if got != want:
              print(f"::error title=Skip count changed::{got} tests skipped, "
                    f"expected {want}. A skip appearing on its own is a test "
                    f"that stopped running; update EXPECTED_SKIPS in tests.yml "
                    f"if this one is deliberate.")
              for t, why in res.skipped:
                  print(f"  skipped: {t.id()} — {why}")
              sys.exit(1)
          print(f"{res.testsRun} tests, {got} skipped (expected {want})")
          PY
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: tests/tradeModel.test.ts is a TypeScript file run
          # directly by `node --test`, which needs Node >= 22.18 (the release
          # that unflagged type stripping). tsc doesn't care which of the two
          # it runs under, and nothing else in this job pinned 20 — so the
          # whole job moves rather than growing a second setup-node. deploy.yml
          # still builds on 20; that is the shipping toolchain, untouched.
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck (vite build does NOT typecheck)
        run: npm run typecheck
      # The trade maths behind both shells' trade screens — monotonicity,
      # 1-for-1 neutrality, pick timing, the throw-in floor. It is NOT covered
      # by the typecheck above (tsconfig's `include` is ["src"], so the test
      # file is outside the program) and NOT covered by the Python job, so
      # without this step nothing in CI enforced it.
      #
      # Node's own runner with native type stripping: no framework, no build
      # step, no dependency — and no node_modules either, since the module
      # under test has zero runtime imports. Run from the repo root; the file's
      # own header documents the invocation, and `npm test` wraps it.
      - name: Trade-model invariants (node --test, TS via type stripping)
        run: npm test
