name: Daily data refresh
# Runs DAILY. The one call that made this expensive — Sleeper's ~19 MB player
# map — is fetched at most ONCE A DAY behind a date-keyed cache shared with the
# crawl-trades movers job (see the cache block below). Everything else Sleeper
# serves here (matchups, rosters, transactions) is small.
#
# Until 2026-09-21 this job read the WEEKLY cache players-refresh.yml saves on
# Tuesdays, which in-season meant up to a seven-day-old map: stale
# injury_status, new players missing from the WAR pool for a week, and lagging
# NFL teams. players-refresh.yml still runs weekly — it owns the ESPN id join —
# but the daily map no longer depends on it. sleeper_war.py still reports how
# many players it had to skip.
on:
  schedule:
    # 06:17 UTC = 1:17 AM EST (2:17 AM EDT). NOT :00 — every workflow here used
    # to fire on the hour, which is GitHub's most congested slot across all of
    # Actions, and this run was observed starting four to six hours late. A
    # minute off the hour costs nothing and leaves the queue. Each workflow in
    # this repo now owns a distinct minute (see the table in PROJECT_NOTES);
    # the hours are unchanged.
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
# The four PIPELINE jobs that commit to main — data-refresh, values-refresh,
# war-history and players-refresh — share this group, so they can never race
# each other to push (a manual dispatch during a scheduled run used to fail on
# a rejected push). The group is also what ORDERS them: the clock only staggers
# their starts, and a congested queue can reorder that, but two of them can
# never be in flight at once.
# Deliberately not every committing workflow: the crawls each own a group of
# their own (crawl-signals, crawl-drafts, crawl-outcomes-<shard>) because a
# five-hour crawl holding data-push would block the daily refresh behind it.
# They absorb the race in their own fetch / re-parent / retry loop instead.
concurrency:
  group: data-push
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Caches pip's DOWNLOAD cache, keyed on requirements-ci.txt, so the
          # scikit-learn/scipy/polars wheels are not re-fetched every night.
          # It does NOT install anything — the install step is further down,
          # deliberately AFTER the invariants below.
          cache: pip
          cache-dependency-path: requirements-ci.txt
      # Stays stdlib-only and stays FIRST: nothing is pip-installed above this
      # line, so the engine invariants are checked against the same bare 3.12
      # the tests.yml python job uses. The pinned libraries land further down,
      # just before the first step that needs them.
      - name: Engine invariants (fail before touching Sleeper)
        run: python -m unittest discover -s tests
      # ---- the Sleeper player map: DAILY, not weekly (2026-09-21) -----------
      # This used to be a read-only restore of whatever players-refresh.yml
      # saved on Tuesday, which made the map up to SEVEN DAYS old in-season:
      #   * `injury_status` drives the "hurt, don't penalize start%" rule in
      #     blend_values.py and contender_index.py, and in-season that field
      #     moves every day — a Tuesday map prices Sunday's injuries as healthy;
      #   * a player added to Sleeper mid-week is absent from the map and so
      #     out of the WAR pool for up to a week;
      #   * NFL team changes (waivers, practice-squad elevations) lag the same way.
      # Sleeper's guidance is at most one call a day for this ~19 MB endpoint,
      # and one a day is exactly what a DATE-KEYED cache buys.
      #
      # Same shape and the same key as the crawl-trades `movers` job's entry
      # (see its comment), deliberately: both run on main, so they share a cache
      # scope, and a shared key means whichever runs first that day pays for the
      # fetch and the other gets an exact hit and makes no call at all. The
      # movers job runs on odd hours from 01:xx, so in practice the map is
      # usually already warm by the time this 06:17 run starts.
      #
      # restore-keys are a two-step fallback: the newest earlier DAILY copy
      # first, then `players-nfl-` to pick up the weekly job's save, so a clone
      # with neither still lands something.
      - name: Day stamp for the player-map cache key
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore/persist the Sleeper player map (daily)
        id: pmap
        uses: actions/cache@v4
        with:
          path: sleeper_data/players.json
          key: players-nfl-daily-${{ steps.day.outputs.d }}
          restore-keys: |
            players-nfl-daily-
            players-nfl-
      # Fetch whenever TODAY's key missed — a prefix restore gives us yesterday's
      # map, which is the staleness this block exists to remove. The original
      # self-heal is kept inside it: a first run, or a cache evicted after 7 idle
      # days, restores nothing at all and would fail sleeper_war.py outright.
      #
      # sleeper_pull writes through ioutil's atomic replace and `require()`
      # raises before writing anything, so a failed fetch CANNOT clobber a
      # restored copy — which is why a failure here is only fatal when there is
      # no restored copy to fall back to.
      - name: Fetch today's player map
        if: steps.pmap.outputs.cache-hit != 'true'
        run: |
          if [ -s sleeper_data/players.json ]; then
            echo "no same-day cache; refreshing yesterday's map ($(du -h sleeper_data/players.json | cut -f1))"
            python scripts/sleeper_pull.py --players-only --out sleeper_data || {
              echo "::warning title=Player map refresh failed::Sleeper did not \
              serve /players/nfl; continuing on the restored (older) map. \
              injury_status and any brand-new player are stale for this run."
            }
          else
            echo "::warning title=Player map cache miss::nothing restored at all — \
            downloading inline. Check that players-refresh.yml is running weekly."
            python scripts/sleeper_pull.py --players-only --out sleeper_data
          fi
      - name: Report the player map in play
        run: |
          echo "player map: $(du -h sleeper_data/players.json | cut -f1), \
          same-day cache hit = ${{ steps.pmap.outputs.cache-hit }}"
      # SEPTEMBER RITUAL: this is Big Dog's CURRENT-SEASON league_id, and
      # Sleeper mints a new one every season. When the new season's league is
      # created, update this id by hand. History keeps working either way —
      # sleeper_pull walks previous_league_id back through 2022 — so a missed
      # update fails quietly: the site simply never gains the new season.
      - name: Pull league history from Sleeper
        run: python scripts/sleeper_pull.py 1312221243742621696 --out sleeper_data
      - name: Compute WAA/WAR
        run: python scripts/sleeper_war.py --data sleeper_data
      - name: Build site JSON
        run: python scripts/build_site_data.py --data sleeper_data --out data
      # ---- Pineapple Pizza FFL (redraft; alias pineapple-pizza) -------------
      # Same pull -> WAR -> build chain against its own dump dir. Its build
      # MERGES into data/leagues.json (build_site_data replaces only its own
      # entry), so the two leagues can build in either order. The player map is
      # shared from the cached copy above rather than re-downloaded. The whole
      # block is fail-soft: a problem with the second league must never cost
      # Big Dog its daily refresh.
      #
      # SEPTEMBER RITUAL, same as the Big Dog id above: 1382780734728597504 is
      # Pineapple Pizza's CURRENT-SEASON league_id and Sleeper mints a new one
      # each season — update it by hand when the new league is created. The
      # chain walk back through previous_league_id keeps every past season
      # working either way, so a missed update just means no new season.
      - name: Pineapple Pizza — pull, WAR, build
        id: pizza
        continue-on-error: true
        run: |
          python scripts/sleeper_pull.py 1382780734728597504 --out sleeper_data_pizza
          cp sleeper_data/players.json sleeper_data_pizza/players.json
          python scripts/sleeper_war.py --data sleeper_data_pizza
          python scripts/build_site_data.py --data sleeper_data_pizza --out data
      - name: Flag Pineapple Pizza failure
        if: steps.pizza.outcome == 'failure'
        run: |
          echo "::warning title=Pineapple Pizza refresh failed::the second \
          league's pull/WAR/build failed; its site data is a day stale. Big Dog \
          continues unaffected."
      - name: Rebuild pick values (Bridge A; needs data/<season>/summary.json)
        run: python scripts/pick_value.py
      - name: Draft results per franchise (needs data/pick_values.json)
        run: python scripts/draft_analysis.py
      # The trade tracker used to sit HERE, and that was a one-day skew: it
      # reads projections.json for `future`, for the projected draft slots and
      # for the frozen-once `exp` snapshot, and the projection chain below does
      # not rewrite projections.json until ~40 lines further down. Running here
      # priced tonight's teams.json against YESTERDAY's projections. It now
      # runs after project_matrix — see that step.
      # needs each season's bracket.json + weekly.json from build_site_data
      - name: Playoff WPA (Shapley, per matchup — drives Playoff MVP)
        run: python scripts/playoff_wpa.py
      # production over replacement, credited win or lose; reads bracket.json
      - name: Playoff WAR
        run: python scripts/playoff_war.py
      # regular-season win share, weeks 1..playoff_start-1; reads only
      # weekly.json + matchups.json, so it runs on whatever build_site_data
      # just wrote. Was never in this workflow before 2026-09-17, so the
      # current season's winshare.json only moved when Max ran it by hand.
      - name: Regular-season win share (season_wpa)
        run: python scripts/season_wpa.py
      - name: Fetch Sleeper projections (composite input)
        id: fetch_proj
        run: python scripts/fetch_projections.py
        continue-on-error: true
      - name: Flag stale projections
        if: steps.fetch_proj.outcome == 'failure'
        run: |
          echo "::warning title=Stale projections::fetch_projections.py failed — \
          projections/composite this run are computed from the PREVIOUS inputs. \
          Trade values may be a week stale; investigate before relying on them."
      # Must follow the projection fetch: an unplayed week's line is built
      # from proj_sleeper.json, so running earlier would quote this week's
      # games off last week's projections.
      # --snapshot archives THIS week's projections, so the week can be priced
      # off what was known at the time once it's in the past. Sleeper only
      # serves current projections; without the archive a past week can only
      # ever fall back to a positional prior.
      - name: Week odds (pregame win probability per matchup)
        run: python scripts/week_odds.py --snapshot
      - name: Recompute WAR projections (scalar model)
        run: python scripts/project_war.py
      # THE PRICING MODEL (Max, 2026-09-11): points first, WAR from the
      # projected pool. Reads the scalar's projections.json just written, parks
      # it at projections_scalar.json for the comparison lens, and rewrites
      # projections.json in the same schema — so everything after this step
      # (value_bridge, the matrix, shards, index_models) prices on it. It is
      # what the site QUOTES, but since scripts/curves.py landed on 2026-09-16
      # it is no longer "the" model in the singular: points-first is one of four
      # arms in the six-curve matrix and the published default curve is
      # blend_composite. `--site` stays — pricing off the points arm is Max's
      # decision, and only the wording here was wrong.
      #
      # Needs scikit-learn (~2 min to fit 24 tree ensembles); every data input
      # is committed (nfl_history/*.csv, proj_sleeper.json, players_min.json).
      #
      # PINNED, not `pip install scikit-learn` — see requirements-ci.txt for the
      # three-day outage that bought these pins. nflreadpy/polars come from the
      # same file, which is why this one step covers the usage block below too.
      - name: Install pinned Python libraries
        id: deps
        continue-on-error: true
        run: pip install -r requirements-ci.txt
      - name: Flag a failed dependency install
        if: steps.deps.outcome == 'failure'
        run: |
          echo "::warning title=Dependency install failed::pip install -r \
          requirements-ci.txt failed — the points model and the nflverse usage \
          refresh below will fail and fall back to yesterday's outputs. The \
          pull/WAR/build and the commit continue."
      # FAIL-SOFT, same shape as the Pizza block above. This step is mid-chain:
      # before 2026-09-21 a modelling-library break here took the whole night
      # with it — the pull, the WAR recompute, the build and the commit had all
      # already run and were discarded. Now it is allowed to fail and the
      # outputs it would have rewritten are restored from the checkout.
      #
      # WHY RESTORING IS THE COHERENT CHOICE, not leaving what is on disk:
      # project_points --site rewrites projections.json in place, and everything
      # downstream (value_bridge, project_war_knn, project_matrix,
      # trade_analysis, shard_players, index_models) reads it. If the step dies
      # partway the tree holds project_war.py's SCALAR projections.json under a
      # points-model schema stamp — a set that disagrees with itself. Checking
      # the four files back out gives the downstream chain yesterday's
      # points-model projections: one day stale, but internally consistent, and
      # every consumer below prices off the same numbers. The final
      # validate_data gate still runs and still blocks the commit if it isn't.
      #
      # scripts/project_points.py now exits NON-ZERO under --site when it
      # rewrote nothing, so this step genuinely fails instead of passing
      # quietly — which is the whole reason it needs a restore.
      - name: Points-first projections (the pricing arm)
        id: points
        continue-on-error: true
        run: python scripts/project_points.py --site
      - name: Restore yesterday's projections if the points model failed
        if: steps.points.outcome == 'failure'
        run: |
          # One pathspec per checkout, not one call with four: git checkout
          # aborts the WHOLE call if any single pathspec matches nothing
          # tracked, so a league that has no projections_scalar.json yet would
          # otherwise block the restore of the three that do exist.
          for p in 'data/leagues/*/projections.json' \
                   'data/leagues/*/projections_points.json' \
                   'data/leagues/*/projections_scalar.json' \
                   'nfl_history/projections_points.json'; do
            git checkout -- "$p" 2>/dev/null \
              || echo "  (nothing tracked at $p — skipped)"
          done
          echo "::warning title=Points model failed::project_points.py --site \
          failed; projections.json / projections_points.json / \
          projections_scalar.json were restored from the checkout. Every \
          downstream price (value_bridge, the matrix, trades, shards, DVI/CVI) \
          is therefore ONE DAY STALE but coherent — they all read the same \
          restored projections. Investigate before trusting tonight's values."
      - name: Bridge B (market value -> WAR, refit on fresh projections)
        run: python scripts/value_bridge.py
      # after project_war and the analog model: the matrix reads both, so it
      # cannot run earlier or it publishes six curves off a stale scalar arm
      # The analog arm of the six-curve matrix. Hand-run until 2026-08-12, which
      # meant the file below was as fresh as the last time someone remembered —
      # project_matrix's staleness check could see the drift but nothing fixed
      # it. Cheap enough that there was never a real reason to leave it out:
      # ~3s, ~45 MB, pure stdlib, no network. Every input is committed
      # (nfl_history/*.csv, aging_curves.json, players_min.json), so it needs
      # nothing the checkout doesn't already have.
      #
      # --space hybrid is not a default: the writer names its output
      # projections_knn_<space>.json and project_matrix reads the hybrid one.
      # Change the space here and the matrix silently keeps reading the old file.
      #
      # Runs AFTER build_site_data (which writes players_min.json, the Sleeper
      # side of the join) and BEFORE project_matrix, which consumes it.
      - name: Analog projection (kNN comparables -> projections_knn_hybrid.json)
        run: python scripts/project_war_knn.py --space hybrid
      # FAIL-SOFT for the same reason as the points step: it reads two arms and
      # writes one file, and scripts/project_matrix.py now exits NON-ZERO on a
      # seed mismatch between arms rather than publishing curves that were fitted
      # against different draws. That is the right call — and it means this step
      # can now take the night down, so it gets the same treatment. Restoring
      # projections_matrix.json leaves the shards and the player page reading
      # yesterday's six curves, which is one day stale and self-consistent;
      # publishing a mismatched matrix would not be.
      - name: Six-curve projection matrix (scalar / analog / blend / points)
        id: matrix
        continue-on-error: true
        run: python scripts/project_matrix.py
      - name: Restore yesterday's matrix if it failed
        if: steps.matrix.outcome == 'failure'
        run: |
          git checkout -- 'data/leagues/*/projections_matrix.json' 2>/dev/null \
            || echo "  (nothing tracked at data/leagues/*/projections_matrix.json — skipped)"
          echo "::warning title=Projection matrix failed::project_matrix.py \
          failed (a seed mismatch between arms exits non-zero by design); \
          projections_matrix.json was restored from the checkout, so the \
          six-curve table and the shards below carry YESTERDAY's curves."
      # MOVED HERE 2026-09-21 (was ~35 lines above, between draft_analysis and
      # playoff_wpa). trade_analysis reads data/<league>/projections.json for
      # `future`, for the projected draft slots and for the frozen-once `exp`
      # snapshot — and projections.json is not final until project_points
      # rewrites it. Run up there it compared tonight's teams.json against
      # yesterday's projections, and the `exp` snapshot froze that skew
      # permanently. It also reads values.json, which value_bridge refits just
      # above, and pick_values.json, which pick_value.py wrote earlier.
      # Nothing between the old slot and here consumes trades.json:
      # validate_data.py's trade floor is the only downstream reader in the
      # pipeline (playoff_wpa / playoff_war / season_wpa / the projection chain
      # do not touch it), and that gate still runs at the end.
      - name: Trade tracker (after the projection chain — reads projections.json)
        run: python scripts/trade_analysis.py
      # ---- usage and efficiency (Max, 2026-09-16) ---------------------------
      # The nflverse skill features on the site. Past seasons' CSVs are
      # war-history.yml's and are not rebuilt here; the ROSTER season's line is
      # the one that moves every week, so it alone is refreshed nightly (one
      # season, ~20s) and copied beside the others. A failed nflverse fetch is
      # a warning, not a failed run: usage_stats.py reads whatever CSVs exist —
      # the if/else below is already the fail-soft shape, and it now also
      # absorbs "nflreadpy isn't importable" (the pinned install above is
      # continue-on-error, so a PyPI problem lands here as a warning too).
      - name: Current-season skill features (usage, efficiency, expected points)
        run: |
          Y=$(python -c "import json; r=json.load(open('data/leagues.json')); print(next(l for l in r['leagues'] if l['key']==r['default'])['rosterSeason'])")
          if python scripts/nfl_features.py --start "$Y" --end "$Y" --out nfl_history_data/features \
             && [ -s "nfl_history_data/features/features_$Y.csv" ]; then
            cp "nfl_history_data/features/features_$Y.csv" nfl_history/
            cp "nfl_history_data/features/features_weekly_$Y.csv" nfl_history/ 2>/dev/null || echo "::warning title=No weekly table::features_weekly_$Y.csv was not written — usage.json for $Y is built from the last committed one"
          else
            echo "::warning title=Usage not refreshed::nfl_features.py failed for $Y — usage.json is built from the last committed CSV"
          fi
      - name: Usage and efficiency for the site (usage.json per season)
        run: python scripts/usage_stats.py --out data
      # LAST of the projection chain, and that ordering is the whole point: a
      # shard now carries the player's matrix row, his analog projection (with
      # the named comparables) and his usage rows as well as his
      # projections.json row, so the player page fetches ~2 KB instead of the
      # whole files (~1.6 MB).
      # Running before project_war_knn / project_matrix — where this step sat
      # until 2026-09-01 — published shards holding the PREVIOUS night's curves
      # beside the current night's scalar projection, which is worse than stale:
      # the six-curve table would have disagreed with itself by one day.
      # Its other inputs all land earlier — projections.json (project_war, then
      # rewritten by project_points), proj_sleeper.json (fetch_projections),
      # players_min.json (build_site_data) and usage.json (just above) — so the
      # move is safe in both directions.
      # (This block described the shard step all along; until 2026-09-21 it had
      # drifted up the file and sat above the usage steps instead.)
      - name: Shard per-player projections for the site
        run: python scripts/shard_players.py --out data
      # ONE step, not two: index_models.py runs blend_values and contender_index
      # across all six projection curves and writes dvi.json + cvi.json on the
      # default (blend_composite) plus index_models.json with all six. It loads
      # the ~19 MB Sleeper player map once for the lot — twelve invocations
      # would have made that the whole cost of the feature. ~1s for all six.
      - name: DVI + CVI under every projection curve
        run: python scripts/index_models.py
      # after DVI: CVI reads dvi.json to publish the gap between them
      - name: Validate built data before committing
        run: python scripts/validate_data.py
      - name: Commit updated data
        run: |
          git config user.name "big-dog-bot"
          git config user.email "actions@users.noreply.github.com"
          # heal a stale conflicted rebase (detached HEAD) before staging anything
          git rebase --abort 2>/dev/null || true
          # RE-PARENT, never rebase — see crawl-signals.yml for the full
          # reasoning. Everything below is a generated file rewritten whole, so a
          # rebase that lands on a conflicting edit conflicts on every retry and
          # no number of attempts clears it; the run then exits 1 and the day's
          # update is lost. A mixed reset onto origin keeps the working tree,
          # drops the local commit and stages only our own paths, so ours wins by
          # construction and anything else on main is carried forward untouched.
          #
          # STAGING IS AN EXPLICIT ALLOW-LIST, not `git add data`, and that is
          # load-bearing under re-parent: after the reset the index sits at
          # origin while the tree is still at checkout, so a directory add would
          # stage a REVERSION of any crawl that pushed mid-run. These FOUR paths
          # are this pipeline's entire committed surface (verified against its
          # commit history) — data/leagues.json from build_site_data, values.json
          # written back by value_bridge, the league tree itself, and the roster
          # season's features CSV, which the usage step above refreshes nightly
          # (war-history.yml owns the other years; same concurrency group, so
          # the two never stage over each other).
          PATHS="data/leagues data/leagues.json data/values.json nfl_history/features_*.csv"
          # Files under data/ this workflow must never touch: every one is owned
          # by a crawl (crawl-signals, crawl-drafts, crawl-outcomes, or the
          # crawl-trades movers job), which is a different concurrency group and
          # so genuinely can push mid-run. The allow-list above already excludes
          # them; this catches the future edit that widens it back to a
          # directory without thinking about ownership. The `_redraft` suffixes
          # are crawl-signals-redraft's two files: the guard has to name what a
          # widened allow-list could catch, not only what one catches today.
          CRAWL='^data/((league_signals(_redraft)?|crawl_leagues(_redraft)?|draft_signals|rookie_pick_corpus|draft_index|benchmarks|dynasty_movers|tep_map|outcome_signals_[0-9]+)\.json|recent_trades/.*)$'
          for i in 1 2 3 4 5; do
            git fetch origin main || { sleep $((i*10)); continue; }
            git reset FETCH_HEAD
            git add $PATHS
            if git diff --cached --name-only | grep -Eq "$CRAWL"; then
              echo "::error title=Crawl-owned path staged::$(git diff --cached --name-only | grep -E "$CRAWL" | tr '\n' ' ')— refusing to revert a crawl"
              exit 1
            fi
            git diff --cached --quiet && { echo "no data changes to commit"; exit 0; }
            git commit -m "Daily data update $(date -u +%F)"
            git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying in $((i*10))s"; sleep $((i*10))
          done
          echo "push failed after 5 attempts"; exit 1
  deploy:
    needs: refresh
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
