name: Daily data refresh
# Runs DAILY. The one call that made this expensive — Sleeper's ~19 MB player
# map — moved to players-refresh.yml on a weekly cadence; this job restores it
# from cache instead of downloading it. Everything else Sleeper serves here
# (matchups, rosters, transactions) is small.
#
# A player added to Sleeper since the last weekly map run is not in the cached
# copy and is skipped for the day; sleeper_war.py reports how many.
on:
  schedule:
    - cron: "0 6 * * *"   # every day 06:00 UTC = 1:00 AM EST (2:00 AM EDT)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
# The three PIPELINE jobs that commit to main — data-refresh, values-refresh and
# war-history — share this group, so they can never race each other to push (a
# manual dispatch during a scheduled run used to fail on a rejected push).
# Deliberately not every committing workflow: the crawls each own a group of
# their own (crawl-signals, crawl-drafts, crawl-outcomes-<shard>) because a
# five-hour crawl holding data-push would block the daily refresh behind it.
# They absorb the race in their own fetch / re-parent / retry loop instead.
concurrency:
  group: data-push
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Engine invariants (fail before touching Sleeper)
        run: python -m unittest discover -s tests
      # The weekly job (players-refresh.yml) saves this; restore-keys takes the
      # newest match so a daily run never re-downloads 19 MB.
      - name: Restore the weekly player map
        uses: actions/cache/restore@v4
        with:
          path: sleeper_data/players.json
          # `key` is a placeholder that never hits, by design: the weekly job
          # saves under players-nfl-<run_id>, so no cache is ever named this and
          # the restore ALWAYS lands through the restore-keys prefix, taking the
          # newest map. It reads like a bug and is not one — an exact-match key
          # here would have to be the run id of a job we don't know about.
          key: players-nfl-restore
          restore-keys: players-nfl-
      # Self-heal: a first run, or a cache evicted after 7 idle days, would
      # otherwise fail sleeper_war.py outright. Fetching here costs one extra
      # call on the rare miss rather than one every day.
      - name: Fetch the player map if the cache missed
        run: |
          if [ ! -s sleeper_data/players.json ]; then
            echo "::warning title=Player map cache miss::downloading it inline; \
            check that players-refresh.yml is running weekly."
            python scripts/sleeper_pull.py --players-only --out sleeper_data
          else
            echo "player map restored from cache ($(du -h sleeper_data/players.json | cut -f1))"
          fi
      - name: Pull league history from Sleeper
        run: python scripts/sleeper_pull.py 1312221243742621696 --out sleeper_data
      - name: Compute WAA/WAR
        run: python scripts/sleeper_war.py --data sleeper_data
      - name: Build site JSON
        run: python scripts/build_site_data.py --data sleeper_data --out data
      - name: Rebuild pick values (Bridge A; needs data/<season>/summary.json)
        run: python scripts/pick_value.py
      - name: Draft results per franchise (needs data/pick_values.json)
        run: python scripts/draft_analysis.py
      - name: Trade tracker
        run: python scripts/trade_analysis.py
      # needs each season's bracket.json + weekly.json from build_site_data
      - name: Playoff WPA (Shapley, per matchup — drives Playoff MVP)
        run: python scripts/playoff_wpa.py
      # production over replacement, credited win or lose; reads bracket.json
      - name: Playoff WAR
        run: python scripts/playoff_war.py
      - name: Fetch Sleeper projections (composite input)
        id: fetch_proj
        run: python scripts/fetch_projections.py
        continue-on-error: true
      - name: Flag stale projections
        if: steps.fetch_proj.outcome == 'failure'
        run: |
          echo "::warning title=Stale projections::fetch_projections.py failed — \
          projections/composite this run are computed from the PREVIOUS inputs. \
          Trade values may be a week stale; investigate before relying on them."
      # Must follow the projection fetch: an unplayed week's line is built
      # from proj_sleeper.json, so running earlier would quote this week's
      # games off last week's projections.
      # --snapshot archives THIS week's projections, so the week can be priced
      # off what was known at the time once it's in the past. Sleeper only
      # serves current projections; without the archive a past week can only
      # ever fall back to a positional prior.
      - name: Week odds (pregame win probability per matchup)
        run: python scripts/week_odds.py --snapshot
      - name: Recompute WAR projections
        run: python scripts/project_war.py
      - name: Shard per-player projections for the site
        run: python scripts/shard_players.py --out data
      - name: Bridge B (market value -> WAR, refit on fresh projections)
        run: python scripts/value_bridge.py
      # after project_war and the analog model: the matrix reads both, so it
      # cannot run earlier or it publishes six curves off a stale scalar arm
      - name: Six-curve projection matrix (scalar / analog / blend)
        run: python scripts/project_matrix.py
      - name: DVI (ensemble trade value -> data/dvi.json)
        run: python scripts/blend_values.py
      # after DVI: CVI reads dvi.json to publish the gap between them
      - name: CVI (one-year contender value -> data/cvi.json)
        run: python scripts/contender_index.py
      - name: Validate built data before committing
        run: python scripts/validate_data.py
      - name: Commit updated data
        run: |
          git config user.name "big-dog-bot"
          git config user.email "actions@users.noreply.github.com"
          # heal a stale conflicted rebase (detached HEAD) before staging anything
          git rebase --abort 2>/dev/null || true
          git add data
          git diff --cached --quiet && { echo "no data changes to commit"; exit 0; }
          git commit -m "Daily data update $(date -u +%F)"
          # retry rebase+push: a human/bot push in the window would otherwise
          # fail the run outright and drop this week's update
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push attempt $i failed; retrying in $((i*10))s"; sleep $((i*10))
          done
          echo "push failed after 5 attempts"; exit 1
  deploy:
    needs: refresh
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write