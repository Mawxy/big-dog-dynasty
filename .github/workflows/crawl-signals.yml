name: Crawl - signals (discovery + roster/start rates)
# The ONLY discoverer. Snowballs dynasty leagues, records roster%/start%/taxi%
# over a rolling window, and publishes the counted-league list the trades/drafts
# crawlers consume. State persists across runs via the cache; a 7-day cooldown
# means each 6-hour run reaches new leagues (and refreshes stale ones).
on:
  schedule:
    - cron: "0 0,6,12,18 * * *"   # every 6h; trades/drafts run an hour later
  workflow_dispatch:
    inputs:
      max_leagues:
        description: "visit cap per run (blank = time-bounded only)"
        default: ""
permissions:
  contents: write
concurrency:
  group: crawl-signals
  cancel-in-progress: false
jobs:
  signals:
    runs-on: ubuntu-latest
    # 350 vs --max-minutes 300: same margin as crawl-outcomes — 15 minutes was
    # not enough for checkout + commit + cache save and could cancel mid-save,
    # losing the cache as well as the run.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore/persist crawl state
        uses: actions/cache@v4
        with:
          # The shared player map rides along with the state dir: it is the same
          # ~19 MB for every mode and shard, so sleeper_crawl caches it once at
          # .crawl-state/ rather than once per --state dir. Each job is its own
          # runner, so per-lane is as shared as CI can make it — this keeps the
          # download at once a day per lane instead of once per run.
          path: |
            .crawl-state/signals
            .crawl-state/players_nfl.json
          key: crawl-signals-${{ github.run_id }}   # unique -> always saves
          restore-keys: crawl-signals-              # restore latest previous
      - name: Crawl signals
        env:
          MAX: ${{ github.event.inputs.max_leagues }}
        run: |
          EXTRA=""
          [ -n "$MAX" ] && EXTRA="--max-leagues $MAX"
          python scripts/sleeper_crawl.py --mode signals \
            --state .crawl-state/signals --max-minutes 300 --commit-every 1000 $EXTRA
      - name: Commit signals + league list
        # NOT always(): a cancelled run was killed at an arbitrary point, which
        # may be the middle of a multi-megabyte flush. success() || failure()
        # keeps this backstop for a crawl that ended on its own terms — the
        # normal case, since the crawler exits 0 even when it stops early — and
        # skips it for one that was cut off.
        if: success() || failure()
        run: |
          git config user.name "big-dog-bot"
          git config user.email "actions@users.noreply.github.com"
          # heal a stale conflicted rebase (detached HEAD) left by an older run
          git rebase --abort 2>/dev/null || true
          # Stage only what parses. These files are rewritten whole every flush,
          # so skipping a broken one costs a single cycle — committing it
          # publishes truncated JSON to every consumer until the next run.
          stage() {
            for f in "$@"; do
              if python -m json.tool "$f" > /dev/null 2>&1; then
                git add "$f"
              else
                echo "::warning title=Invalid JSON::$f is missing or did not parse — not committing it"
              fi
            done
          }
          # RE-PARENT, never rebase. Both outputs are generated files rewritten
          # whole on every flush, so a rebase hits a content conflict on every
          # replayed commit and no number of retries can clear it — that is what
          # wedged this job. Their history is worth nothing: the crawler's real
          # state lives in the cache, and only the newest complete file matters.
          # A mixed reset onto origin keeps the working tree, drops the local
          # commits, and stages only our own paths, so ours wins by construction.
          # Safe because this workflow is the ONLY writer of these two files —
          # crawl-trades is contents:read and crawl-drafts writes different ones.
          for i in 1 2 3 4 5; do
            git fetch origin main || { sleep $((i*10)); continue; }
            git reset FETCH_HEAD
            stage data/league_signals.json data/crawl_leagues.json
            git diff --cached --quiet && { echo "no changes"; exit 0; }
            git commit -m "Crawl signals $(date -u +%FT%H:%MZ)"
            git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying in $((i*10))s"; sleep $((i*10))
          done
          echo "push failed after 5 attempts"; exit 1
