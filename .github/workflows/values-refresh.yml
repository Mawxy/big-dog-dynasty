name: Market values refresh
on:
  schedule:
    - cron: "0 11 * * *"   # daily 11:00 UTC = 6/7 AM ET; touches NO Sleeper endpoints
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:            # shared with data-refresh / war-history — see data-refresh.yml
  group: data-push
  cancel-in-progress: false
jobs:
  values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch market values (FantasyCalc + KeepTradeCut)
        run: python scripts/fetch_values.py
      # ECR is an independent opinion signal, not load-bearing like the market
      # pull, and it scrapes an embedded payload that FantasyPros can restyle
      # without warning. A layout change must not block the values commit.
      - name: Fetch FantasyPros ECR
        continue-on-error: true
        run: python scripts/fetch_ecr.py
      - name: Bridge B (market value -> WAR, needs data/projections.json)
        run: python scripts/value_bridge.py
      - name: Validate values before committing
        run: python scripts/validate_data.py --values-only
      - name: Commit updated values
        run: |
          git config user.name "big-dog-bot"
          git config user.email "actions@users.noreply.github.com"
          # heal a stale conflicted rebase (detached HEAD) before staging anything
          git rebase --abort 2>/dev/null || true
          # RE-PARENT, never rebase — see crawl-signals.yml, and data-refresh.yml
          # for why the stage list stays explicit. Every path here is regenerated
          # whole, so ours-wins is the correct resolution and a rebase conflict
          # would just be an unclearable way to lose the day's values.
          #
          # values*.json and ecr.json are global; value_bridge.json is
          # league-scoped. No crawl writes any of them. data/values.json does have
          # a second writer — value_bridge.py augments it with impWar/modelWar and
          # runs in data-refresh too — but that workflow shares the `data-push`
          # concurrency group, so the two can never be in flight at once.
          for i in 1 2 3 4 5; do
            git fetch origin main || { sleep $((i*10)); continue; }
            git reset FETCH_HEAD
            git add data/values.json data/values_history.json data/ecr.json data/leagues/*/value_bridge.json
            git diff --cached --quiet && { echo "no value changes to commit"; exit 0; }
            git commit -m "Market values $(date -u +%F)"
            git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying in $((i*10))s"; sleep $((i*10))
          done
          echo "push failed after 5 attempts"; exit 1
  deploy:
    needs: values
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
